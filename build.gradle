plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '5.4.5'
group = 'com.srp.draconite'
archivesBaseName = 'srpdraconite'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven { url = "https://maven.minecraftforge.net/" }
    mavenCentral()
    maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    accessTransformer = file("src/main/resources/META-INF/accesstransformer.cfg")

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                srpdraconite {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {}
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.2.4')
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "srpdraconite",
            "Specification-Vendor"    : "SRPDraconite",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "SRPDraconite",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
